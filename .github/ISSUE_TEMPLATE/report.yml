name: Compatibility report
description: How did a game or launcher run through Highball?
labels: [report]
body:
  - type: markdown
    attributes:
      value: "One line is enough. If you played through Highball, the button it shows after a session opens this form with the chip, macOS, engine and graphics mode filled in."
  - type: input
    id: title
    attributes: { label: Game or launcher, placeholder: "Elden Ring" }
    validations: { required: true }
  - type: input
    id: steam_appid
    attributes: { label: Steam AppID (if a Steam game), placeholder: "1245620" }
  - type: dropdown
    id: rating
    attributes:
      label: Rating
      options: ["5 — perfect", "4 — playable, minor issues", "3 — playable with workarounds", "2 — launches, not playable", "1 — does not launch"]
    validations: { required: true }
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options: [dxmt, d3dmetal, dxvk, wined3d]
  - type: input
    id: chip
    attributes: { label: Chip, placeholder: "Apple M1 Pro" }
  - type: input
    id: macos
    attributes: { label: macOS version, placeholder: "14.6" }
  - type: input
    id: engine
    attributes: { label: Engine id, placeholder: "x64-sikarugir10.0_6-r0" }
  - type: input
    id: version
    attributes: { label: Highball version, placeholder: "0.9.6" }
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: "Three short lines help most: what you played into (a menu, a level, a match), for how long, and the frame rate if the Metal HUD was on. Then anything that mattered: a setting, a glitch, a workaround."
      placeholder: "Played a full bot match on Dust II for 25 min, 100 to 108 fps at 1728x1117 on the Metal HUD. No settings changed."
