name: Ingest reports
on:
  issues:
    types: [labeled]
jobs:
  ingest:
    if: github.event.label.name == 'report-accepted'
    runs-on: ubuntu-latest
    permissions: { contents: write, issues: write }
    steps:
      - uses: actions/checkout@v4
      - name: Append report
        env:
          BODY: ${{ github.event.issue.body }}
          NUM: ${{ github.event.issue.number }}
          USER: ${{ github.event.issue.user.login }}
          CREATED: ${{ github.event.issue.created_at }}
        run: python3 Scripts/ingest-report.py
      - name: Commit
        run: |
          git config user.name highball-bot && git config user.email bot@users.noreply.github.com
          git add db/reports && git commit -m "db: report #${{ github.event.issue.number }}" && git push
