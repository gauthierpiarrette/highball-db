name: Validate
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/validate-db.py
      - run: python3 Scripts/test-ingest.py
