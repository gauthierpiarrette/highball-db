name: Build & deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/validate-db.py && python3 Scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  # The public site is gethighball.com, built from the separate highball-website repo, which
  # rebuilds on its own push, a db-updated dispatch, or its schedule. Without this nudge a data
  # change here stayed invisible there until the next scheduled run - an entry could be correct
  # in the database and stale on the page people actually read.
  #
  # Needs a token that can reach the other repo (GITHUB_TOKEN is scoped to this one). If the
  # secret is absent the step says so and succeeds: the site still catches up on its schedule,
  # and a missing optional secret must never fail a deploy.
  notify-website:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ask the website to rebuild
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set - gethighball.com will pick this up on its own schedule."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gauthierpiarrette/highball-website/dispatches \
            -d '{"event_type":"db-updated"}'
          echo "asked highball-website to rebuild"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
